name: Android R3 English checks
concurrency:
  group: android-r3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned official sherpa Android AAR
        shell: pwsh
        run: ./scripts/install-sherpa.ps1
      - name: Tests and debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :core-model:test :core-audio:testDebugUnitTest :core-asr:testDebugUnitTest :service:testDebugUnitTest :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: realtime-translator-r3-english-debug
          path: app/build/outputs/apk/debug/*.apk
